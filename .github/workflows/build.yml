name: Build Windows exe

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller==6.11.1 pytest

      - name: Run tests
        run: python -m pytest -q

      - name: Check the app modules import
        run: python -c "import ldr.app, ldr.ui, ldr.gcal; print('imports ok')"

      - name: Make icon
        run: python -c "from ldr.app import make_icon; make_icon().save('icon.ico', sizes=[(16,16),(32,32),(48,48),(64,64)])"

      - name: Build single exe
        run: >
          pyinstaller --noconfirm --onefile --windowed
          --name LibraryDayReminder --icon icon.ico
          --hidden-import pystray._win32
          --collect-data googleapiclient
          main.py

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: LibraryDayReminder
          path: dist/LibraryDayReminder.exe

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          files: dist/LibraryDayReminder.exe
